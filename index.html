<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Choose your Gorillas version — classic rooftop artillery duels."
    />
    <meta name="theme-color" content="#080b1b" />
    <title>Gorillas — Choose Your Version</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b1b;
        --ink: #f6f3ff;
        --muted: #a7aac8;
        --panel: rgba(11, 14, 34, 0.85);
        --panel-edge: rgba(162, 183, 255, 0.25);
        --cyan: #63f4e8;
        --gold: #ffc95f;
        --pink: #ff6ba9;
        --purple: #9b7bff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        font-family: "Space Grotesk", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        overflow-x: hidden;
      }

      body {
        min-height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(
            ellipse 120% 80% at 50% -20%,
            rgba(99, 244, 232, 0.12),
            transparent 50%
          ),
          radial-gradient(
            ellipse 80% 60% at 80% 100%,
            rgba(255, 107, 169, 0.1),
            transparent 45%
          ),
          radial-gradient(
            ellipse 60% 40% at 10% 80%,
            rgba(155, 123, 255, 0.08),
            transparent 40%
          ),
          var(--bg);
      }

      .container {
        max-width: 820px;
        width: 100%;
        text-align: center;
      }

      header {
        margin-bottom: 2.5rem;
      }

      .badge {
        display: inline-block;
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--cyan);
        border: 1px solid rgba(99, 244, 232, 0.35);
        border-radius: 999px;
        padding: 0.35rem 0.85rem;
        margin-bottom: 1rem;
        background: rgba(99, 244, 232, 0.06);
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 0.75rem;
        background: linear-gradient(
          135deg,
          var(--ink) 0%,
          var(--cyan) 50%,
          var(--gold) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        font-size: 1.1rem;
        color: var(--muted);
        max-width: 480px;
        margin: 0 auto;
        line-height: 1.5;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        margin-top: 2.5rem;
      }

      .card {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 18px;
        padding: 1.75rem 1.5rem 1.5rem;
        text-align: left;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 18px;
        padding: 1px;
        background: linear-gradient(
          145deg,
          rgba(99, 244, 232, 0.4),
          transparent 40%,
          transparent 60%,
          rgba(255, 201, 95, 0.25)
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        opacity: 0.6;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: rgba(99, 244, 232, 0.45);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.35),
          0 0 30px rgba(99, 244, 232, 0.08);
      }

      .card-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        margin-bottom: 1.1rem;
        background: rgba(99, 244, 232, 0.1);
        border: 1px solid rgba(99, 244, 232, 0.2);
      }

      .card.version2 .card-icon {
        background: rgba(255, 201, 95, 0.1);
        border-color: rgba(255, 201, 95, 0.25);
      }

      .card h2 {
        font-size: 1.35rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        letter-spacing: -0.01em;
      }

      .card .tag {
        display: inline-block;
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--cyan);
        margin-bottom: 0.85rem;
      }

      .card.version2 .tag {
        color: var(--gold);
      }

      .card p {
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 1.4rem;
      }

      .card ul {
        list-style: none;
        margin-bottom: 1.5rem;
      }

      .card li {
        font-size: 0.88rem;
        color: var(--muted);
        padding: 0.25rem 0;
        padding-left: 1.2rem;
        position: relative;
      }

      .card li::before {
        content: "▸";
        position: absolute;
        left: 0;
        color: var(--cyan);
        font-size: 0.75rem;
      }

      .card.version2 li::before {
        color: var(--gold);
      }

      .play-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        justify-content: center;
        padding: 0.85rem 1.25rem;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 1rem;
        font-weight: 600;
        color: var(--bg);
        background: linear-gradient(135deg, var(--cyan), #3dd4c8);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          filter 0.15s ease;
      }

      .play-btn:hover {
        transform: scale(1.02);
        box-shadow: 0 6px 24px rgba(99, 244, 232, 0.35);
        filter: brightness(1.05);
      }

      .card.version2 .play-btn {
        background: linear-gradient(135deg, var(--gold), #e6a93d);
      }

      .card.version2 .play-btn:hover {
        box-shadow: 0 6px 24px rgba(255, 201, 95, 0.35);
      }

      footer {
        margin-top: 3rem;
        font-size: 0.85rem;
        color: var(--muted);
        opacity: 0.75;
      }

      footer a {
        color: var(--cyan);
        text-decoration: none;
      }

      @media (max-width: 600px) {
        body {
          padding: 1.5rem 1rem;
          justify-content: flex-start;
          padding-top: 2.5rem;
        }

        .cards {
          gap: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="badge">Rooftop Artillery</div>
        <h1>Gorillas</h1>
        <p class="subtitle">
          Two versions of the classic banana-throwing duel. Pick one and start
          throwing.
        </p>
      </header>

      <div class="cards">
        <article class="card version1">
          <div class="card-icon">🦍</div>
          <span class="tag">Polished Edition</span>
          <h2>Neon City</h2>
          <a class="play-btn" href="version1/index.html">
            Play Version 1
            <span aria-hidden="true">→</span>
          </a>
        </article>

        <article class="card version2">
          <div class="card-icon">🍌</div>
          <span class="tag">Classic Edition</span>
          <h2>Classic</h2>
          <a class="play-btn" href="version2/index.html">
            Play Version 2
            <span aria-hidden="true">→</span>
          </a>
        </article>
      </div>

      <footer>Drag to aim · Release to throw · Watch the wind</footer>
    </div>
  </body>
</html>
